name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      catalogue_mode:
        description: "Catalogue comparison mode"
        type: choice
        options: [reuse, baseline, weekly]
        default: reuse
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Tamil film catalogue
        run: npm run pages:data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_MAX_FILMS: 1000
          CATALOGUE_REFRESH_MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.catalogue_mode || 'reuse' }}
      - name: Save weekly catalogue comparison
        if: github.event_name == 'schedule' || inputs.catalogue_mode == 'baseline' || inputs.catalogue_mode == 'weekly'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalogue-history.json
          git diff --cached --quiet || git commit -m "Update weekly catalogue history [skip ci]"
          git push
      - run: npm run pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
